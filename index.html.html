header{text-align:center;padding:26px 16px 20px;background:linear-gradient(155deg,#0d2744 0%,var(--blue) 55%,var(--tq) 100%);color:#fff}
.langs{display:flex;justify-content:center;gap:6px;margin-bottom:12px}
.langs button{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;padding:4px 14px;border-radius:999px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.langs button.on{background:#fff;color:#12355b}
.logo-badge{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);font-size:2.2rem;margin-bottom:8px}
header h1{margin:0;font-size:1.95rem;font-weight:800}
header p{margin:6px auto 0;max-width:580px;opacity:.95}
.hud{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.pill{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.22);padding:5px 15px;border-radius:999px;font-size:.9rem;font-weight:600}
nav{display:flex;gap:8px;overflow-x:auto;padding:12px 14px;position:sticky;top:0;background:var(--bg);border-bottom:1px solid var(--line);z-index:10}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;font-weight:600;font-size:.92rem;cursor:pointer}
nav button.on{background:var(--gold);color:#fff;border-color:var(--gold)}
main{max-width:880px;margin:0 auto;padding:18px 16px 32px}
section{display:none;animation:fade .25s ease}
section.on{display:block}

h2{color:var(--blue);margin:6px 0 12px;font-size:1.4rem;font-weight:800}
.sub{color:var(--mute);margin-top:-6px;margin-bottom:14px;font-size:.95rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:0 3px 12px rgba(0,0,0,.04)}

.tog button.on{border-color:var(--tq);background:var(--tq);color:#fff}
.flip{cursor:pointer;min-height:165px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.flip .back{display:none}.flip.f .front{display:none}.flip.f .back{display:block}
.box-tool{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:22px}
input[type=text]{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:1.05rem}
input[type=text]:focus{outline:none;border-color:var(--tq)}
.out-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;min-height:68px;padding:12px;border-radius:12px;background:var(--bg);border:1px dashed var(--line)}
.sym-chip{display:flex;flex-direction:column;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px;min-width:64px}
.sym-chip span:first-child{font-size:1.9rem;line-height:1.2}
.sym-chip span:last-child{font-size:.75rem;color:var(--mute);font-weight:600}
.tool-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.opt{display:block;width:100%;text-align:start;margin:9px 0;padding:13px 15px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--tq)}
.opt.ok{border-color:var(--ok);background:rgba(30,142,90,.15)}
.opt.bad{border-color:var(--bad);background:rgba(192,57,43,.15)}
.explain{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--gold-soft);border-inline-start:4px solid var(--gold);font-size:.93rem;font-weight:600;display:none}
.btn{background:var(--gold);color:#fff;border:0;padding:10px 20px;border-radius:12px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:var(--tq)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.bar{height:9px;background:var(--line);border-radius:9px;overflow:hidden;margin:10px 0 14px}
.bar i{display:block;height:100%;background:var(--tq);width:0;transition:width .35s ease}
.vision-hero{background:linear-gradient(135deg,var(--gold-soft),rgba(15,139,141,.1));border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px}
footer{text-align:center;color:var(--mute);padding:20px;font-size:.86rem;border-top:1px solid var(--line)}
</style>
</head>

past:[["Pyramids of Giza","Built by the ancient Egyptians about 4,500 years ago, they are among history’s greatest feats of architecture.","💡 Did you know? The Great Pyramid was the tallest structure on Earth for nearly 3,800 years."],["Historic Cairo","Streets, mosques and markets telling over a thousand years of Islamic architecture in the heart of the capital.","💡 Think: how did builders combine beauty with function?"],["Ancient Library of Alexandria","A beacon of learning that gathered knowledge and scholars from across the ancient world.","💡 Question: how do nations preserve their memory?"],["The First Suez Canal","Opened in 1869, it linked the Mediterranean to the Red Sea and shortened trade routes.","💡 Impact: it redrew world shipping from day one."],["Avenue of Sphinxes, Luxor","An ancient ceremonial road linking Karnak and Luxor temples, lined with statues.","💡 Glimpse: it hosted Egypt’s grandest ancient festivals."]],

var lat={a:"🦅",b:"🦶",c:"🧺",d:"✋",e:"🖐️",f:"🦂",g:"🏺",h:"🏠",i:"🖐️",j:"🏺",k:"🧺",l:"🦁",m:"🦉",n:"🌊",o:"🐣",p:"🦶",q:"⛰️",r:"👤",s:"🌾",t:"🍞",u:"🐣",v:"🦂",w:"🐣",x:"🧺",y:"🖐️",z:"🔱"};

var L="ar",t=T.ar,pts=0,which="past",tab="time",lv=0,qi=0,sc=0,finished=false;
try{L=localStorage.getItem("lang")||"ar";if(!T[L])L="ar"}catch(e){}

function rank(){var i=pts>=60?3:pts>=30?2:pts>=10?1:0;$("rank").textContent=t.ranks[i]}
function add(n){pts+=n;$("pts").textContent=pts;rank()}

function renderNav(){
  $("nav").innerHTML=t.nav.map(function(n,i){return '<button data-t="'+["time","dict","craft","quiz","about"][i]+'"'+(["time","dict","craft","quiz","about"][i]==tab?' class="on"':'')+'>'+n+'</button>'}).join("");
  document.querySelectorAll("#nav button").forEach(function(b){b.onclick=function(){
    tab=b.dataset.t;
    document.querySelectorAll("#nav button").forEach(function(x){x.classList.toggle("on",x===b)});
    document.querySelectorAll("section").forEach(function(s){s.classList.toggle("on",s.id===tab)});
  }});
}
function drawT(){
  var a=t[which],E=which=="past"?EP:EN;
  $("tg").innerHTML=a.map(function(c,i){return '<div class="card"><div class="em">'+E[i]+'</div><h3>'+c[0]+'</h3><p>'+c[1]+'</p><div class="q">'+c[2]+'</div></div>'}).join("");
  $("bp").classList.toggle("on",which=="past");$("bn").classList.toggle("on",which=="now");
}
function drawName(){
  var v=($("nm").value||"").trim();if(!v)v=L=="ar"?"جنى":"Jana";
  var out=[];
  for(var ch of v){
    if(ch===" "){out.push('<div class="sym-chip" style="opacity:.4"><span>·</span><span>'+t.space+'</span></div>');continue}
    var em=null,lab=ch;
    if(map[ch]){em=map[ch][0];lab=L=="ar"?ch+" · "+map[ch][1]:ch}
    else{var b=ch.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();if(lat[b]){em=lat[b];lab=ch.toUpperCase()}}
    if(em)out.push('<div class="sym-chip"><span>'+em+'</span><span>'+lab+'</span></div>');
  }
  $("out").innerHTML=out.join("");
}
function drawStatic(){
  $("h1").textContent=L=="ar"?"جذور وأفق":L=="en"?"Roots & Horizons":"Racines et Horizons";
  document.title=t.title;
  $("tag").textContent=t.tag;$("ptl").textContent=t.pts;$("dsg").textContent=t.dsg;
  $("timeH").textContent=t.timeH;$("timeS").textContent=t.timeS;$("bp").textContent=t.bp;$("bn").textContent=t.bn;
  $("dictH").textContent=t.dictH;$("dictS").textContent=t.dictS;
  $("nameH").textContent=t.nameH;$("nameS").textContent=t.nameS;$("nm").placeholder=t.ph;
  $("copyBtn").textContent=t.copy;$("clearBtn").textContent=t.clear;$("note").textContent=t.note;
  $("craftH").textContent=t.craftH;$("craftS").textContent=t.craftS;
  $("quizH").textContent=t.quizH;$("quizS").textContent=t.quizS;
  $("aboutH").textContent=t.aboutH;
  $("vis").innerHTML='<h3 style="margin:0 0 6px;color:var(--blue)">'+t.visT+'</h3><p style="margin:0">'+t.visP+'</p>';
  $("ag").innerHTML=t.about.map(function(c){return '<div class="card"><div class="em">'+c[0]+'</div><h3>'+c[1]+'</h3><p>'+c[2]+'</p></div>'}).join("");
  $("f1").textContent=t.f1+": "+NAME;$("f2").textContent=t.f2;
  $("dg").innerHTML=t.syms.map(function(s,i){return '<div class="card flip" onclick="this.classList.toggle(\'f\');add(2)"><div class="front"><div class="em" style="font-size:3rem">'+ES[i]+'</div><h3>'+s[0]+'</h3><div class="q">'+t.tap+'</div></div><div class="back"><h3>'+s[1]+'</h3><p>'+s[2]+'</p></div></div>'}).join("");
  $("cg").innerHTML=t.crafts.map(function(c,i){return '<div class="card"><div class="em">'+EC[i]+'</div><h3>'+c[0]+'</h3><div class="q">📍 '+c[1]+'</div><p>'+c[2]+'</p><p><strong>💡 '+t.dig+':</strong> '+c[3]+'</p></div>'}).join("");
  document.querySelectorAll("#langs button").forEach(function(b){b.classList.toggle("on",b.dataset.l===L)});
}
function setLang(l){
  L=l;t=T[l];try{localStorage.setItem("lang",l)}catch(e){}
  document.documentElement.lang=l;document.documentElement.dir=l=="ar"?"rtl":"ltr";
  drawStatic();renderNav();drawT();drawName();rank();finished?end():show();
}
document.querySelectorAll("#langs button").forEach(function(b){b.onclick=function(){setLang(b.dataset.l)}});
$("bp").onclick=function(){which="past";drawT()};
$("bn").onclick=function(){which="now";drawT()};
$("nm").oninput=drawName;
$("clearBtn").onclick=function(){$("nm").value="";drawName()};
$("copyBtn").onclick=function(){
  var s=Array.from($("out").querySelectorAll(".sym-chip span:first-child")).map(function(x){return x.textContent}).join(" ");
  try{if(navigator.clipboard)navigator.clipboard.writeText(s)}catch(e){}
  $("copyBtn").textContent=t.copied;setTimeout(function(){$("copyBtn").textContent=t.copy},1400);
};

function show(){
  var n=lv*2+qi,q=t.quiz[n];
  var h='<div class="q">'+t.lvl[lv]+' · '+t.qof(qi+1,2)+'</div><div class="bar"><i style="width:'+(n/6*100)+'%"></i></div><h3>'+EQ[n]+' '+q[0]+'</h3>';
  q[1].forEach(function(o,i){h+='<button class="opt" data-i="'+i+'">'+o+'</button>'});
  h+='<div class="explain" id="exp"></div><button class="btn" id="nxt" style="display:none;margin-top:12px">'+t.next+'</button>';
  $("qb").innerHTML=h;
  document.querySelectorAll(".opt").forEach(function(b){b.onclick=function(){pick(+b.dataset.i,QC[n],q[2])}});
}
function pick(i,c,info){
  var os=document.querySelectorAll(".opt");
  os.forEach(function(o){o.disabled=true;o.onclick=null});
  os[c].classList.add("ok");
  if(i===c){sc++;add(10)}else os[i].classList.add("bad");
  var e=$("exp");e.textContent=(i===c?t.ok:t.bad)+info;e.style.display="block";
  var x=$("nxt");x.style.display="inline-block";
  x.onclick=function(){qi++;if(qi>1){qi=0;lv++}if(lv>2)end();else show()};
}
function end(){
  finished=true;
  var b=Math.min(2,Math.max(0,Math.ceil(sc/2)-1));
  $("qb").innerHTML='<h3>'+t.done+'</h3><p>'+t.score(sc)+'</p><div style="font-size:1.5rem;font-weight:800;color:var(--gold);margin:10px 0">'+BD[b]+' '+t.badges[b]+'</div><button class="btn" id="re">'+t.again+'</button>';
  $("re").onclick=function(){lv=0;qi=0;sc=0;finished=false;show()};
}
setLang(L);
</script>
</body>
</html>
